# Elastic Weight Consolidation (EWC) strategy
# Inherits from base configuration and adds EWC-specific settings

defaults:
  - ../base

strategy:
  name: ewc
  lambda: 1000.0           # EWC regularization strength
  fisher_samples: 500      # Number of samples for Fisher Information computation
  diagonal_only: true      # Use diagonal Fisher approximation (more memory efficient)
  fisher_normalize: true   # Normalize Fisher values

run_name: ewc_default