[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlip-finetuning-strategies"
dynamic = ["version"]
description = "A systematic evaluation framework for continual learning strategies in Machine Learning Interatomic Potentials (MLIP) finetuning."
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "torch>=1.12.0",
    "ase>=3.22.0",
    "numpy>=1.21.0",
    "pyyaml>=6.0",
    "wandb>=0.12.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
nequip = ["nequip>=0.5.0"]
allegro = ["allegro>=0.2.0"]
mace = ["mace-torch>=0.2.0"]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
]

[project.urls]
Homepage = "https://github.com/yourusername/mlip-finetuning-strategies"
Repository = "https://github.com/yourusername/mlip-finetuning-strategies"
Documentation = "https://github.com/yourusername/mlip-finetuning-strategies/blob/main/README.md"

[project.scripts]
mlip-finetune = "mlip_finetuning_strategies.cli:main"

[tool.hatch.version]
path = "src/mlip_finetuning_strategies/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mlip_finetuning_strategies"]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true